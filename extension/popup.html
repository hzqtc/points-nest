<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Points Nest</title>
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="app-title-container">
        <h1 class="app-title">Points Nest <span class="title-total" id="title-total"></span></h1>
      </div>
    </header>

    <!-- Accounts List -->
    <section class="accounts-section">
      <div id="accounts-list" class="accounts-list"></div>
    </section>
  </div>

  <!-- Template for Empty State -->
  <template id="empty-state-template">
    <div class="empty-state">
      <p>No accounts tracked yet.</p>
      <span>Log in to loyalty program portals to sync balances automatically.</span>
    </div>
  </template>

  <!-- Template for Account Card -->
  <template id="account-card-template">
    <div class="account-card">
      <div class="account-left">
        <img class="account-icon" data-src="icon" />
        <div class="account-info">
          <span class="account-provider" data-text="title"></span>
          <span class="account-name" data-text="account"></span>
        </div>
      </div>
      <div class="account-right-container">
        <div class="account-pts">
          <span class="pts-amount" data-text="points"></span>
          <div class="pts-updated" data-text="updated"></div>
        </div>
        <button class="refresh-btn" title="Refresh Balance">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>
      </div>
    </div>
  </template>

  <script src="popup.js"></script>
</body>
</html>
