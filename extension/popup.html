<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Points Tracker</title>
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title">Points Tracker</h1>
      <div class="status-badge" id="daemon-status">
        <span class="status-indicator"></span>
        <span class="status-text">Checking...</span>
      </div>
    </header>

    <!-- Accounts List -->
    <section class="accounts-section">
      <div id="accounts-list" class="accounts-list">
        <div class="empty-state">
          <p>No accounts tracked yet.</p>
          <span>Log in to your Chase portal to sync balances automatically.</span>
        </div>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
